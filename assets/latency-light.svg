<text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">One tick, two paths: <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#1a7f37">p50 106 ns</tspan> vs <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#0969da">36 µs</tspan><tspan fill="#59636e" font-weight="400"> (335× faster over shared memory)</tspan></text>
<text x="24" y="54" font-size="11.5" fill="#59636e">Lock-free SPSC ring in POSIX shared memory vs the same tick as JSON over TCP. Latency = receive − send, both on CLOCK_MONOTONIC.</text>
