<svg xmlns="http://www.w3.org/2000/svg" width="880" height="262" viewBox="0 0 880 262" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="879" height="261" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#e6edf3">One tick, two paths: <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#3fb950">p50 250 ns</tspan> vs <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#58a6ff">20 µs</tspan><tspan fill="#8b949e" font-weight="400"> (82× faster over shared memory)</tspan></text>
<text x="24" y="54" font-size="11.5" fill="#8b949e">Lock-free SPSC ring in POSIX shared memory vs the same tick as JSON over TCP. Latency = receive − send, both on CLOCK_MONOTONIC.</text>
